# Cohort E: DECODED (EUROBENCH), lower-limb exoskeleton, 7 participants
# Walking under motor imagery (code 404) against standing relaxed (402);
# walking while counting (406) is dropped. Condition 3.
cohort: E
data:
  dir: decoded        # holds dataset.zip (or set DECODED_ZIP)
  protocol: EXPERIENCE
  sfreq_in: 200
  sfreq: 100
  classes_display: [stand, walk]
  band: [8, 30]       # 4th-order Butterworth, forward-backward (offline)
  window_s: 4.0
  step_s: 0.5
split:
  rule: first half of the runs fit, second half test
  heldout_frac: 0.3

model:
  n_filt: 16          # temporal filters per scale (64, 128, 256 ms)
  d_model: 128        # embedding width
  dropout: 0.3
  momentum: 0.2       # reference update rate m (memory mu ~ 1/m batches)
  shrink: 0.1         # covariance shrinkage lambda

train:
  epochs: 30
  batch: 32           # windows per forward pass = per reference update (N)
  lr: 3.0e-4          # AdamW, OneCycle schedule
  weight_decay: 1.0e-2
  patience: 12        # early stopping on held-out balanced accuracy
  clip: 1.0           # gradient-norm clip

seeds: [0, 1, 2]
